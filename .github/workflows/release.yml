name: release

# Build easystream (the Linux est daemon) for amd64 and arm64, run its tests, and
# attach both binaries to the GitHub Release for the pushed tag.
#
# NATIVE RUNNERS, NOT CROSS-COMPILATION.
#
# The arm64 binary used to be cross-compiled on an x86 runner. Building worked
# but testing could not: a cross-compiled arm64 test binary cannot be EXECUTED
# there at all —
#
#   error: test failed, to rerun pass `--bin easystream`
#     Exec format error (os error 8)
#
# so the test step had to be downgraded to `cargo check`, which only proves the
# code compiles. On a native arm64 runner the tests actually run, and the whole
# cross-toolchain apparatus disappears: no dpkg --add-architecture, no
# ports.ubuntu.com, no pkg-config cross variables, no FORTIFY surprises.
#
# The build-time libraries (x264, opus, yuv, xcb, wayland-client, xkbcommon,
# dbus, pipewire) are linked into the binary; libpipewire-0.3-dev is required or
# the portal backend is skipped silently and na_portal_* fails to link.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build assets for"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04-arm is a native arm64 runner, so the tests run for real.
          - { runner: ubuntu-latest,    arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libdbus-1-dev libx264-dev libyuv-dev libopus-dev \
            libpipewire-0.3-dev \
            libxcb1-dev libxcb-xtest0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-render0-dev \
            libwayland-dev libxkbcommon-dev

      # The SPA lives in another repository and build.rs inlines it with
      # include_str!. build-webui.sh just downloads a tarball, so no Node needed.
      - name: fetch the shared web UI
        run: bash build-webui.sh

      # Native: the tests really execute here.
      - name: test
        run: cargo test --release

      - name: build
        run: |
          set -euo pipefail
          cargo build --release
          out="easystream-linux-${{ matrix.arch }}"
          cp target/release/easystream "/tmp/$out"
          chmod +x "/tmp/$out"
          ls -l "/tmp/$out"
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"

      # What the binary needs at run time, which is the difference between "runs
      # on the runner" and "runs in the sandbox".
      - name: runtime dependencies
        run: ldd "/tmp/$ARTIFACT" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: /tmp/easystream-linux-*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/assets
          merge-multiple: true
      - run: ls -l /tmp/assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: /tmp/assets/easystream-linux-*
          fail_on_unmatched_files: true
          generate_release_notes: false
