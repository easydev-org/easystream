name: release-matrix

# One binary per LIBRARY BASE, because that is what has to match.
#
# THE PROBLEM, IN ONE LINE OF OUTPUT
#
#     $ ./easystream-linux-amd64
#     symbol lookup error: undefined symbol: x264_encoder_open_164
#
# libx264 puts its ABI number in the SONAME *and* in every exported symbol, and the two move
# together:
#
#     0.164.x -> libx264.so.164 -> x264_encoder_open_164
#     0.165.x -> libx264.so.165 -> x264_encoder_open_165
#
# A symlink from .164 to .165 satisfies the loader and not the linker, so the failure lands
# one step later, at symbol resolution. The only fix is to link against the library the guest
# actually has - which means building on that base.
#
# glibc is the second constraint and it is not fixable either: a binary built on Ubuntu 26.04
# needs GLIBC_2.39, so it will not start on Debian 12 (2.36) whatever libx264 is there.
#
# THE TABLE BELOW IS DERIVED FROM easydiskbake's OWN PINS. What matters is the BASE an image
# is built on, not the distro's name:
#
#     ubuntu-26.04   ubuntu, kubuntu                    glibc 2.43, x264 165
#     ubuntu-24.04   mint, popos, zorin                  glibc 2.39, x264 164
#     debian-13      mx                                  glibc 2.41, x264 164
#     debian-12      (the apt family's glibc floor)       glibc 2.36, x264 164
#     arch           cachyos, endeavour, manjaro         rolling,    x264 165
#     fedora-43      fedora-workstation                  glibc 2.41, x264 165   [NOT YET]
#     opensuse-tw    opensuse-tumbleweed                 rolling,    x264 165   [NOT YET]
#     nixos-26.05    nixos                               (release.yml's own job)
#     freebsd        ghostbsd                            (vmactions, below)
#
# WHY FEDORA AND OPENSUSE ARE NOT HERE YET
#
# Their x264 is not in the official repositories - Fedora ships it in RPM Fusion and
# openSUSE in Packman - so the install step needs an extra repository and a signature. That
# is a different kind of change from "add a row", and getting it wrong makes the whole job
# fail at `install` rather than at `build`, which tells the next reader nothing. They go in
# once the stages below have run green at least once.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build assets for"
        required: true
      publish:
        description: "Upload to the release, or stop after building (dry run)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- one container per apt-family base --------------------------------------
  #
  # Each runs its OWN package manager, because the point is to link the libraries that base
  # ships. A shared apt-get step would defeat the exercise.
  apt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04
            image: ubuntu:26.04

          - name: ubuntu-24.04
            image: ubuntu:24.04

          - name: debian-13
            image: debian:13

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: the base this binary will be FOR
        run: |
          grep -m3 . /etc/os-release
          echo "---"

      # GIT BEFORE CHECKOUT, AND THIS IS NOT OPTIONAL.
      #
      # `container:` starts from the bare distro image, and ubuntu:26.04 / debian:13 do NOT
      # ship git. actions/checkout@v4 runs `git` on the workspace, so putting the install
      # step after checkout fails with
      #
      #     /__e/node20/bin/node: not found        (ubuntu-24.04 and older containers)
      #     git: command not found                 (the checkout itself)
      #
      # The order below is the fix: package manager first, repository second.
      # GIT FIRST: actions/checkout runs it, and the bare ubuntu:26.04 / debian:13 images
      # do not ship it.
      #
      # NO BASH ON PURPOSE. Every `run:` block here is POSIX sh: `set -eu` and nothing more.
      # An earlier version used `set -euo pipefail`, which is a bash extension, and on
      # Ubuntu and Debian - whose /bin/sh is dash - the first line of the step died with
      #
      #     set: Illegal option -o pipefail
      #
      # before cargo was reached. `pipefail` was not buying anything: every pipeline in this
      # file ends in `|| true` or `|| echo ...`, so the exit status it guards is already
      # handled explicitly. `-e` and `-u` are POSIX and are the two that matter.
      - name: git, before anything else
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: actions/checkout@v4

      # The rest of the libraries, in their own step so a missing package name is one
      # message rather than a wall that also hides the checkout failure above.
      #
      # THESE NAMES WERE VERIFIED on the Ubuntu 26.04 guest this repository already runs,
      # where libx264-dev, libxcb-xtest0-dev and libyuv-dev all resolved by exactly these
      # names. Debian 12 and 13 use the same apt archive layout.
      - name: libraries from this base's own apt
        run: |
          apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libdbus-1-dev libx264-dev libyuv-dev libopus-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libxcb1-dev libxcb-xtest0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-render0-dev \
            libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: fetch the shared web UI
        run: bash build-webui.sh

      - name: build
        run: |
          set -eu
          cargo build --release
          sh ci/package.sh "${{ matrix.name }}" "${GITHUB_REF_NAME:-0.0.0}"

      # THE VERDICT IS IN THESE LINES, and they are what a future reader needs: which x264
      # ABI this binary asks for, which this base provides, and the glibc floor it imposes.
      # A green build that prints a mismatch is a build that will fail in a guest.

      - name: what this binary links, and what this base provides
        run: |
          set -eu
          out=target/release/easystream
          echo "=== the ABI this binary ASKS FOR ==="
          nm -D "$out" 2>/dev/null | grep -m2 -oE 'x264_encoder_open_[0-9]+' || echo "  (none)"
          echo "=== the ABI this base PROVIDES ==="
          found=0
          for so in /usr/lib/x86_64-linux-gnu/libx264.so.* /usr/lib/libx264.so.*; do
            [ -e "$so" ] || continue
            found=1
            printf "  %s: " "$so"
            nm -D "$so" 2>/dev/null | grep -m1 -oE 'x264_encoder_open_[0-9]+' || echo "?"
          done
          [ "$found" = 1 ] || echo "  (libx264 shared object not found)"
          echo "=== glibc floor this binary imposes ==="
          objdump -T "$out" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1 || true
          echo "=== its own glibc ==="
          ldd --version 2>&1 | grep -m1 .
          echo "=== ldd ==="
          ldd "$out" 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # --- Arch (rolling) --------------------------------------------------------
  #
  # ONE BUILD FOR THREE DISTROS. cachyos, endeavour and manjaro are all Arch with a
  # different installer; they track the same repositories closely enough that one binary
  # covers all three. Arch has no release number to pin, which is why this row has no
  # version suffix.
  #
  # WHY `pacman -Syu` AND NOT `-Sy`. Arch's partial-upgrade rule: refreshing the package
  # database without upgrading the installed system leaves libraries at one version and
  # their dependents at another, and the container is then in a state no Arch user ever
  # has. `-Syu` inside a fresh container is a full upgrade of a throwaway - the correct
  # thing here even though it is the wrong thing on a real machine.
  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      # git before checkout: archlinux:latest ships git, but the ca-certificates and the
      # keyring are what a container needs before it can verify anything over TLS.
      - name: keyring before anything over TLS
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring ca-certificates git

      - uses: actions/checkout@v4

      - name: libraries from Arch's own repositories
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel pkgconf curl \
            dbus x264 libyuv opus \
            pipewire \
            libxcb xcb-util \
            wayland libxkbcommon libx11
          echo "=== what Arch provides ==="
          pacman -Q x264 libyuv opus dbus pipewire 2>/dev/null || true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: arch

      - name: fetch the shared web UI
        run: bash build-webui.sh

      - name: build
        run: |
          set -eu
          cargo build --release
          sh ci/package.sh "arch" "${GITHUB_REF_NAME:-0.0.0}"

      - name: what this binary links, and what this base provides
        run: |
          set -eu
          out=target/release/easystream
          echo "=== the ABI this binary ASKS FOR ==="
          nm -D "$out" 2>/dev/null | grep -m2 -oE 'x264_encoder_open_[0-9]+' || echo "  (none)"
          echo "=== the ABI this base PROVIDES ==="
          for so in /usr/lib/libx264.so.*; do
            [ -e "$so" ] || continue
            printf "  %s: " "$so"
            nm -D "$so" 2>/dev/null | grep -m1 -oE 'x264_encoder_open_[0-9]+' || echo "?"
          done
          echo "=== glibc floor ==="
          objdump -T "$out" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1 || true
          ldd "$out" 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: packages-arch
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # --- Manjaro -----------------------------------------------------------------
  #
  # MANJARO IS NOT ARCH FOR THIS PURPOSE, EVEN THOUGH ITS PACKAGES ARE.
  #
  # Manjaro's stable branch takes Arch's packages and holds them back one to two weeks.
  # Measured today, the two were identical:
  #
  #     Manjaro stable extra/x264   0.165.r3222.b35605a-2
  #     Arch           extra/x264   0.165.r3222.b35605a-2
  #
  # - same version, same git commit - which is why the arch job had been covering
  # cachyos, endeavour and manjaro with one binary. But that agreement is a window, not a
  # guarantee: the day Arch bumps x264 and Manjaro has not caught up, the arch binary
  # stops resolving there and nothing in the pipeline would say so. One more build removes
  # the window.
  #
  # `manjarolinux/base` is Manjaro's own image. Its sources point at the STABLE branch,
  # which is the one easydiskbake bakes from - not testing or unstable.
  manjaro:
    runs-on: ubuntu-latest
    container:
      image: manjarolinux/base:latest
    steps:
      - name: git and the keyring, before checkout
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring manjaro-keyring ca-certificates git

      - uses: actions/checkout@v4

      - name: which branch this image tracks
        run: |
          echo "=== the repositories this image uses ==="
          grep -vE '^\s*#|^\s*$' /etc/pacman.conf | head -20
          echo "=== the mirrors ==="
          cat /etc/pacman.d/mirrorlist 2>/dev/null | grep -m3 '^Server'
          echo "=== os-release ==="
          cat /etc/os-release | grep -m4 .

      - name: libraries from Manjaro's own repositories
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel pkgconf curl \
            dbus x264 libyuv opus \
            pipewire \
            libxcb xcb-util \
            wayland libxkbcommon libx11
          echo "=== what Manjaro provides ==="
          pacman -Q x264 libyuv opus dbus pipewire 2>/dev/null || true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: manjaro

      - name: fetch the shared web UI
        run: bash build-webui.sh

      - name: build
        run: |
          set -eu
          cargo build --release
          sh ci/package.sh "manjaro" "${GITHUB_REF_NAME:-0.0.0}"

      - name: what this binary links, and what this base provides
        run: |
          set -eu
          out=target/release/easystream
          echo "=== ABI this binary ASKS FOR ==="
          nm -D "$out" 2>/dev/null | grep -m2 -oE 'x264_encoder_open_[0-9]+' || echo "  (none)"
          echo "=== ABI this base PROVIDES ==="
          for so in /usr/lib/libx264.so.*; do
            [ -e "$so" ] || continue
            printf "  %s: " "$so"
            nm -D "$so" 2>/dev/null | grep -m1 -oE 'x264_encoder_open_[0-9]+' || echo "?"
          done
          echo "=== glibc floor ==="
          objdump -T "$out" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1 || true
          ldd "$out" 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: packages-manjaro
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # --- Fedora -----------------------------------------------------------------
  #
  # TWO RELEASES, NOT ONE. Fedora is a nine-month cycle with a four-release support
  # window, so a binary built for one release is the wrong libx264 ABI for the next about
  # half the time. 44 and 45 are the two that matter now.
  #
  # X264 IS NOT IN FEDORA'S OWN REPOSITORIES. It is in RPM Fusion, because of patent
  # licensing, and without that repository `dnf install x264-devel` fails with a bare
  # "no match". The free repository carries the build pieces; nonfree is not needed here.
  fedora:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora-44
            image: fedora:44
          - name: fedora-45
            image: fedora:45
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: git and the keyring, before checkout
        run: |
          dnf install -y ca-certificates git curl

      - uses: actions/checkout@v4

      - name: RPM Fusion, because x264 is not in Fedora's repos
        run: |
          dnf install -y \
            "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
          dnf makecache

      - name: libraries
        run: |
          dnf install -y \
            gcc gcc-c++ make pkgconf-pkg-config \
            dbus-devel x264-devel libyuv-devel opus-devel \
            pipewire-devel \
            libxcb-devel xcb-util-devel \
            wayland-devel libxkbcommon-devel \
            libX11-devel
          echo "=== what Fedora provides ==="
          rpm -q x264-libs libyuv opus pipewire-libs 2>/dev/null || true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: fetch the shared web UI
        run: bash build-webui.sh

      - name: build
        run: |
          set -eu
          cargo build --release
          sh ci/package.sh "${{ matrix.name }}" "${GITHUB_REF_NAME:-0.0.0}"

      - name: what this binary links, and what this base provides
        run: |
          set -eu
          out=target/release/easystream
          echo "=== ABI this binary ASKS FOR ==="
          nm -D "$out" 2>/dev/null | grep -m2 -oE 'x264_encoder_open_[0-9]+' || echo "  (none)"
          echo "=== ABI this base PROVIDES ==="
          for so in /usr/lib64/libx264.so.*; do
            [ -e "$so" ] || continue
            printf "  %s: " "$so"
            nm -D "$so" 2>/dev/null | grep -m1 -oE 'x264_encoder_open_[0-9]+' || echo "?"
          done
          echo "=== glibc floor ==="
          objdump -T "$out" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1 || true
          ldd "$out" 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # --- openSUSE Leap 16.0 ----------------------------------------------------
  #
  # ONE VERSION, AND THE DOCKER IMAGE IS THE ONLY THING THAT MATTERS HERE.
  #
  # This job builds easystream against the libraries openSUSE Leap 16.0 ships. Whether a
  # Leap ISO also exists is a different question and not this one - the input is
  # `opensuse/leap:16.0` and the output is a package that resolves against what is inside it.
  #
  # 16.1, NOT 16.0, WOULD BE THE CURRENT POINT RELEASE - AND IT CANNOT BE BUILT YET.
  #
  # libyuv is not in Leap's OSS repository; it comes from OBS `multimedia:libs`. That
  # project has a complete repository for 16.0 and none for 16.1:
  #
  #     multimedia:/libs/16.0/repodata/repomd.xml   200   6462 packages, libyuv0 present
  #     multimedia:/libs/16.1/repodata/repomd.xml   404   the directory exists, repodata does not
  #
  # and the project's own page has two open requests asking for it:
  #
  #     "Please enable building against Leap 16.1 for this project"
  #     "Please enable 16.1"
  #
  # So 16.0 is the release whose library set can actually be satisfied today. When those
  # requests land, this row moves to 16.1 and nothing else changes.
  #
  # X264 IS IN PACKMAN. Leap's own OSS repository does not carry it (same patent reason as
  # Fedora), so the Packman repository is added first. `--gpg-auto-import-keys` is used
  # rather than `--no-gpg-checks`: a build that silently accepts an unsigned library is
  # worse than one that fails.
  #
  # THE REPOSITORY PATH IS TRIED IN BOTH SPELLINGS. openSUSE renames these between point
  # releases ("openSUSE_Leap_16.0" vs "openSUSE_Leap_16"), and a wrong path fails at
  # `addrepo` with a 404 that says nothing about which one is right. Whichever resolves
  # first wins, and the step prints which.
  leap:
    runs-on: ubuntu-latest
    container:
      image: opensuse/leap:16.0
    steps:
      # GIT, PLUS THREE THINGS THE RUNNER AND THIS IMAGE DISAGREE ABOUT.
      #
      # bash        opensuse/leap:16.0 ships no bash at all. `dtolnay/rust-toolchain` is a
      #             composite action whose every run step is `shell: bash`, so without it the
      #             job dies before the toolchain step does anything useful:
      #
      #                 OCI runtime exec failed: exec: "bash": executable file not found in $PATH
      #
      #             and build-webui.sh has a bash shebang too.
      #
      # curl        the toolchain action's installer pipes sh.rustup.rs into a shell.
      # ca-certificates  without it that curl fails verification, which reads as a network
      #             problem.
      - name: git and a shell before checkout
        run: zypper --non-interactive install ca-certificates git curl bash

      # THE TOOLCHAIN ACTION RUNS AS ROOT WITH HOME=/github/home ON A CONTAINER JOB, and
      # rustup refuses that combination:
      #
      #     error: $HOME differs from euid-obtained home directory: you may be using sudo
      #     error: $HOME directory: /github/home
      #     error: euid-obtained home directory: /root
      #     info: skipping toolchain installation
      #
      # "skipping toolchain installation" IS THE FAILURE - it exits zero having installed
      # nothing, and the next step says cargo is missing. Pointing HOME at the directory
      # rustup derives from /etc/passwd makes the two agree.

      - uses: actions/checkout@v4

      # X264 AND LIBYUV ARE NOT IN LEAP'S OSS REPOSITORY, AND THEY ARE NOT IN THE SAME
      # PLACE AS EACH OTHER. Measured against the repositories themselves:
      #
      #   x264      Packman Essentials   libx264-165-20250608.b35605ac, libx264-devel
      #   libyuv    OBS multimedia:libs  libyuv-devel-20230517+a377993-lp160
      #
      # Leap's own OSS repo has neither - its x264 is inside ffmpeg-4 and not exposed as a
      # library, and `libsharpyuv0` is WebP's, not libyuv.
      #
      # PACKMAN VIA ftp.gwdg.de, NOT packman.inode.at. The canonical host answered nothing
      # (curl exit 35) when this was being written, while the GWDG mirror served the same
      # tree. A build that depends on one mirror of a third-party repository is a build
      # that stops for reasons unrelated to this code.
      - name: Packman and multimedia:libs, for the two libraries Leap does not carry
        run: |
          set -eu
          . /etc/os-release
          echo "this base: $PRETTY_NAME ($VERSION_ID)"

          zypper --non-interactive addrepo --refresh --priority 90 \
            "https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Leap_${VERSION_ID}/Essentials/" packman
          # NO /x86_64/ ON THIS URL, AND THAT IS NOT OMISSION.
          #
          # OBS publishes two shapes. A per-architecture repository has its repodata under
          # `<project>/<arch>/repodata/`; a FLAT one has repodata at the project root and the
          # RPMs in per-architecture SUBDIRECTORIES beside it. multimedia:libs/16.0 is the
          # second kind, and the primary metadata proves it:
          #
          #     location href="x86_64/libyuv0-20230517+a377993-lp160.20.4.x86_64.rpm"
          #     location href="noarch/AMF-devel-1.5.3-lp160.20.1.noarch.rpm"
          #
          # So the URL with /x86_64/ appended returns 404 for repomd.xml and zypper reports
          #
          #     Retrieving repository 'multimedia-libs' metadata [.error]
          #     Skipping repository 'multimedia-libs' because of the above error.
          #
          # and then `zypper install --from multimedia-libs libyuv-devel` fails with the package
          # not found - a message about libyuv, for a mistake about a URL.
          zypper --non-interactive addrepo --refresh --priority 91 \
            "https://download.opensuse.org/repositories/multimedia:/libs/${VERSION_ID}/" multimedia-libs

          zypper --non-interactive --gpg-auto-import-keys refresh

      - name: libraries
        run: |
          set -eu
          zypper --non-interactive install \
            gcc gcc-c++ make pkg-config \
            dbus-1-devel libopus-devel \
            pipewire-devel \
            libxcb-devel xcb-util-devel \
            wayland-devel libxkbcommon-devel \
            libX11-devel
          echo "=== the two that come from elsewhere ==="
          zypper --non-interactive install --from packman libx264-devel
          zypper --non-interactive install --from multimedia-libs libyuv-devel
          echo
          echo "=== what this base provides ==="
          rpm -qa 2>/dev/null | grep -iE '^(libx264|libyuv|libopus|pipewire)' | sort
          echo "=== the ABI this base will link against ==="
          for so in /usr/lib64/libx264.so.*; do
            [ -e "$so" ] || continue
            printf "  %s: " "$so"
            nm -D "$so" 2>/dev/null | grep -m1 -oE 'x264_encoder_open_[0-9]+' || echo "?"
          done

      # THE DISTRIBUTION'S OWN RUST, NOT RUSTUP.
      #
      # `dtolnay/rust-toolchain` was tried and cannot work in this image. It installs fine -
      # "Rust is installed now. Great!" - and then every later step is `shell: bash
      # --noprofile --norc`, which the runner executes through the container runtime:
      #
      #     OCI runtime exec failed: exec failed: unable to start container process:
      #     exec: "bash": executable file not found in $PATH
      #
      # That message is misleading. bash IS installed - step 3 installs it and `zypper`
      # reports `'bash' is already installed` - but the container is a minimal image with no
      # /bin/sh -> bash convention, and the runner's exec path looks the shell up in a way
      # that does not find it. Rather than fight the harness, use what the distribution
      # ships, which is also the rule this matrix follows everywhere else.
      #
      # Leap 16.0's OSS repository carries rust 1.98:
      #
      #     rust-1.98.0-160000.1.1.x86_64.rpm
      #     cargo-1.95.0-160000.1.1.x86_64.rpm
      #
      # and a package built by the distribution's own toolchain is the one that links against
      # the distribution's own libraries, which is the whole point of this job.
      - name: rust from the distribution
        run: |
          set -eu
          zypper --non-interactive install rust cargo
          echo "=== the toolchain this base provides ==="
          rustc --version
          cargo --version

      # THE CACHE ACTION IS KEPT BUT ITS RUSTUP-SPECIFIC ASSUMPTIONS ARE NOT RELIED ON.
      #
      # Swatinem/rust-cache looks for ~/.cargo and ~/.rustup, which rustup creates and a
      # distribution install does not: `zypper install rust cargo` puts the binaries in /usr/bin
      # and the registry in /usr/share/cargo (CARGO_HOME is unset). The action degrades to
      # caching `target/` only, which is the expensive part and still worth having, and it does
      # not fail when the rustup directories are absent.
      #
      # `workspaces: .` rather than the action's default, because the default keys off a
      # Cargo.lock it finds by walking up from the repository root - which is the same
      # directory here, so this is explicit rather than different.
      - uses: Swatinem/rust-cache@v2
        with:
          key: leap-16.0
          workspaces: .

      - name: fetch the shared web UI
        run: bash build-webui.sh

      - name: build
        run: |
          set -eu
          cargo build --release
          sh ci/package.sh "leap-16.0" "${GITHUB_REF_NAME:-0.0.0}"

      - name: what this binary links, and what this base provides
        run: |
          set -eu
          out=target/release/easystream
          echo "=== ABI this binary ASKS FOR ==="
          nm -D "$out" 2>/dev/null | grep -m2 -oE 'x264_encoder_open_[0-9]+' || echo "  (none)"
          echo "=== ABI this base PROVIDES ==="
          for so in /usr/lib64/libx264.so.*; do
            [ -e "$so" ] || continue
            printf "  %s: " "$so"
            nm -D "$so" 2>/dev/null | grep -m1 -oE 'x264_encoder_open_[0-9]+' || echo "?"
          done
          echo "=== glibc floor ==="
          objdump -T "$out" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1 || true
          ldd "$out" 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: packages-leap-16.0
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  freebsd:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GHOSTBSD SHIPS FreeBSD 14, SO 14 GETS ITS OWN BUILD AND ITS OWN PACKAGE.
          #
          # The ABI is a hard gate and `pkg` enforces it:
          #
          #     pkg: wrong architecture: FreeBSD:15:amd64 instead of FreeBSD:14:amd64
          #
          # - and `pkg add -f` does not override it, because the check is in the installer,
          # not in a convenience flag. GhostBSD 14.1 reports `pkg config abi` =
          # `FreeBSD:14:amd64`, and the repository for that ABI is
          # https://pkg.freebsd.org/FreeBSD:14:amd64/latest/ (200), so a 14.x build resolves
          # against libraries a 14.x guest actually has.
          #
          # 14.1 IS THE RELEASE, NOT 14: the guest reports 14.1-STABLE and vmactions needs a
          # point release to fetch an image. `FreeBSD:14.1:amd64` does not exist as a
          # repository, which is the same reason 15.0 and 15.1 both resolve against
          # `FreeBSD:15` - packages are built per major, and a point release bumps the kernel
          # and userland without rebuilding ports.
          - { release: "14.1", key: "freebsd-14" }
          - { release: "15.1", key: "freebsd-15" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ONE BUILD, FOR 15.1, AND THE REASON IT DOES NOT NEED ONE PER POINT RELEASE IS THE
      # PACKAGE REPOSITORY.
      #
      # FreeBSD's binary packages are built per MAJOR version, not per point release:
      #
      #     https://pkg.freebsd.org/FreeBSD:15:amd64/latest/     200
      #     https://pkg.freebsd.org/FreeBSD:15.0:amd64/latest/   404
      #     https://pkg.freebsd.org/FreeBSD:15.1:amd64/latest/   404
      #
      # So 15.0 and 15.1 install the SAME libx264 from the same catalog - a point release
      # bumps the kernel and userland, and does not rebuild ports. A binary linked here
      # resolves against that one catalog, which is why one build covers 15.x.
      #
      # A major version WOULD need its own build (a `FreeBSD:16:amd64` repository with its
      # own ports revision), and this row is where that goes when 16 arrives.
      - name: build on FreeBSD ${{ matrix.release }}
        uses: vmactions/freebsd-vm@v1
        with:
          release: "${{ matrix.release }}"
          prepare: |
            pkg install -y rust pkgconf gmake x264 libxcb libX11 libXtst libXfixes \
                           opus dbus at-spi2-core libyuv bash
          run: |
            set -eux
            freebsd-version
            echo "=== the package repository this VM uses ==="
            pkg -vv | grep -m2 url
            # build-webui.sh is the one script here with a bash shebang; everything this
            # workflow adds is POSIX sh.
            bash build-webui.sh
            sh ci/patch-freebsd.sh
            cargo build --release
            echo "=== the ABI this binary ASKS FOR ==="
            nm -D target/release/easystream 2>/dev/null \
              | grep -m2 -oE 'x264_encoder_open_[0-9]+' || echo "  (none)"
            echo "=== the ABI this release PROVIDES ==="
            for so in /usr/local/lib/libx264.so.*; do
              [ -e "$so" ] || continue
              printf "  %s: " "$so"
              nm -D "$so" 2>/dev/null | grep -m1 -oE 'x264_encoder_open_[0-9]+' || echo "?"
            done
            # THE PACKAGE IS BUILT HERE, INSIDE THE VM, because `pkg create` and
            # `pkg config abi` are the tools that know what a .pkg for this system is.
            sh ci/package-freebsd.sh "${GITHUB_REF_NAME:-0.0.0}"

      # THE ARTIFACT PATH IS INSIDE THE WORKSPACE, AND `vmactions/freebsd-vm` IS WHY.
      #
      # That action runs the `run:` block inside a FreeBSD VM and copies back only what is
      # under the workspace. The first version wrote the binary to /tmp and the upload step
      # failed with
      #
      #     No files were found with the provided path: /tmp/easystream-linux-amd64-freebsd-15
      #
      # - after the compile had succeeded, so the job's failure said nothing about the build.
      # `dist/` is where package-freebsd.sh writes, and it is inside the checkout.
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.key }}
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 7

  # --- attach everything to the release --------------------------------------
  release:
    needs: [apt, arch, manjaro, fedora, leap, freebsd]
    # DRY RUN BY DEFAULT WHEN DISPATCHED, AND THAT IS NOT CAUTION FOR ITS OWN SAKE.
    #
    # `softprops/action-gh-release` with an existing `tag_name` APPENDS to that release and
    # replaces same-named assets. Dispatching this workflow against the tag that is already
    # published - which is the only tag that exists - would silently overwrite the assets
    # at least one guest is running today. A push of `v*` publishes; a dispatch has to say
    # so explicitly.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/assets
          merge-multiple: true

      # THE VERDICT IS NOW IN THE PACKAGE METADATA, AND THAT IS THE IMPROVEMENT.
      #
      # A bare binary says nothing about what it needs; these packages carry `Depends:` /
      # `Requires:` / `depend=` lines a package manager reads before installing. Printing
      # them here means a wrong dependency name is visible in the release log rather than
      # in a user's failed install.
      - name: what would be published, with the dependencies each one declares
        run: |
          set -eu
          ls -l /tmp/assets
          echo
          for f in /tmp/assets/*; do
            echo "=== $(basename "$f") ==="
            case "$f" in
              *.deb) dpkg-deb -f "$f" Package Version Depends 2>/dev/null || true ;;
              *.rpm) rpm -qp --qf '%{NAME} %{VERSION}\nRequires: [%{REQUIRENAME} ]\n' "$f" 2>/dev/null || true ;;
              *.pkg.tar.zst) tar -xOf "$f" .PKGINFO 2>/dev/null | grep -E '^(pkgname|pkgver|depend)' || true ;;
              *) file "$f" ;;
            esac
            echo
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: /tmp/assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
