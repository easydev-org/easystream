[package]
name = "easystream"
version = "0.1.0"
edition = "2021"
description = "easystream daemon (Linux) — est:// video/input + HTTP a11y/webui"

[[bin]]
name = "easystream"
path = "src/main.rs"

[dependencies]
libc = "0.2"
percent-encoding = "2"
base64 = "0.22"
sha1 = "0.10"
dbus = "0.9"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
panic = "unwind"
